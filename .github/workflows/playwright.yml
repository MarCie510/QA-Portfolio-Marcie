name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 01-SauceDemo-E2E-Project/automation/requirements.txt
      
      - name: Install Playwright browsers
        run: playwright install --with-deps
      
      - name: Run Pytest
        run: pytest 01-SauceDemo-E2E-Project/automation/tests/ -v --tb=short
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 01-SauceDemo-E2E-Project/automation/reports/
          retention-days: 7
